experiment:
  name: conv2l_voltage_clopath_faithful_mnist_REPRO_seed1
  seed: 1
  use_wandb: false
  project: conv-voltage-stdp
  save_dir: ./checkpoints
  device: cuda:0
data:
  dataset: mnist
  encoding: poisson
  sim_time: 300
  intensity: 64.0
  prop: 1.0
model:
  layer1:
    n_filters: 32
    kernel_size: 5
    norm: 10.0
    v_rest: -65.0
    v_reset: -65.0
    v_thresh: -52.0
    tau_v: 100.0
    theta_plus: 0.05
    tc_theta_decay: 10000.0
    inh_weight: 5.0
    refrac_time: 5
    theta_init: 0.0
  layer2:
    n_filters: 64
    kernel_size: 5
    norm: 20.0
    v_rest: -65.0
    v_reset: -65.0
    v_thresh: -52.0
    tau_v: 100.0
    theta_plus: 0.05
    tc_theta_decay: 10000.0
    inh_weight: 2.0
    refrac_time: 5
    theta_init: 0.0
    A_plus: 0.003
voltage:
  rule: clopath
  A_plus: 0.001
  A_minus: 0.003
  ltd_mode: voltage
  use_weight_norm: true
  tau_pre: 16.8
  tau_plus: 7.0
  tau_minus: 10.0
  theta_ltp: null
  theta_ltd: null
  w_max: 1.0
  adex:
    delta_T: 2.0
    v_T_offset: -2.0
    a_adapt: 0.0
    b_adapt: 0.1
    tau_w_adapt: 144.0
    I_sp: 0.2
    tau_z: 40.0
readout:
  hidden_size: 1024
  n_steps: 50
  tau: 10.0
  optimizer: adam
  weight_decay: 0.0
  lr_schedule: none
  label_smoothing: 0.0
  normalize_features: false
training:
  epochs_stdp:
  - 1
  - 1
  readout_epochs: 75
  readout_lr: 0.001
  readout_batch_size: 128
  feat_batch_size: 32
  n_train: 60000
  n_test: 10000
  log_interval: 500
  checkpoint_interval: 10000
